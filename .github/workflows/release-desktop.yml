name: release-desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v0.1.0-rc.6)'
        required: true
        default: 'v0.1.0-rc.6'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Write remote runtime config
        # verify-packaged-runtime.ts requires the remote config in the package;
        # the runtime archive itself is published separately (needs a token for
        # the dsh-dist repository), so write the config and upload the installer
        # update triple (exe + latest.yml + blockmap) here.
        run: node -e "require('node:fs').writeFileSync('resources/runtime-config.json', JSON.stringify({ manifestUrl: 'https://github.com/yxx-jf/dsh-dist/releases/download/v0.1.0/runtime-manifest.json' }))"
      - name: Build installer
        run: pnpm run dist:win:fast
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            dist/DeepSeek-Harness-*.exe
            dist/latest.yml
            dist/DeepSeek-Harness-*.exe.blockmap

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://raw.githubusercontent.com; style-src 'unsafe-inline'">
  <title>插件管理 · DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      -webkit-app-region: drag;
      display: flex; flex-direction: column;
      font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      user-select: none; overflow: hidden;
      --bg-base: #0e1117;
      --bg-layer-1: #12161e;
      --bg-layer-2: #171b24;
      --bg-toolbar: #0a0c12;
      --text-primary: #e8edf7;
      --text-secondary: #8b93a7;
      --text-tertiary: #5f6c88;
      --border-light: rgba(255,255,255,0.08);
      --border-medium: rgba(255,255,255,0.12);
      --accent: rgb(65,118,230);
      --accent-hover: rgb(86,134,254);
      --accent-soft: rgba(103,158,254,0.12);
      --danger: rgba(236,19,19,0.75);
      --danger-hover: rgba(236,19,19,0.9);
      --success: #4ad18b;
      --warning: #ffd24d;
      --card-bg: rgba(255,255,255,0.03);
      --input-bg: rgba(255,255,255,0.04);
      --log-bg: #090b10;
      color: var(--text-primary);
      background: var(--bg-base);
    }
    body[data-ds-dark-theme="false"] {
      --bg-base: #ffffff;
      --bg-layer-1: #f9fafb;
      --bg-layer-2: #f5f6f7;
      --bg-toolbar: #f0f1f3;
      --text-primary: #1f2128;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --border-light: rgba(0,0,0,0.08);
      --border-medium: rgba(0,0,0,0.12);
      --accent: rgb(59,130,246);
      --accent-hover: rgb(37,99,235);
      --accent-soft: rgba(59,130,246,0.1);
      --danger: rgba(239,68,68,0.8);
      --danger-hover: rgba(220,38,38,0.9);
      --success: #16a34a;
      --warning: #d97706;
      --card-bg: rgba(0,0,0,0.02);
      --input-bg: rgba(0,0,0,0.03);
      --log-bg: #f3f4f6;
    }
    header {
      flex: none; display: flex; align-items: baseline; justify-content: space-between;
      padding: 14px 18px 4px;
    }
    header .title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    header .tip { color: var(--text-secondary); font-size: 12px; margin-left: 10px; }
    .lang-btn {
      -webkit-app-region: no-drag;
      height: 26px; padding: 0 10px; font-size: 12px;
      background: var(--card-bg); color: var(--text-secondary);
      border: 1px solid var(--border-light); border-radius: 8px; cursor: pointer;
      transition: all 0.15s ease;
    }
    .lang-btn:hover { color: var(--text-primary); border-color: var(--border-medium); }
    .tabs {
      flex: none; display: flex; gap: 4px; padding: 8px 18px 0;
      -webkit-app-region: no-drag;
    }
    .tab {
      padding: 8px 16px; border: none; border-radius: 10px 10px 0 0;
      background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
    }
    .tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
    .tab:not(.active) { background: transparent; }
    .tab:not(.active):hover { background: rgba(255,255,255,0.04); }
    .tab.active { color: var(--text-primary); background: var(--accent-soft); }
    main { flex: 1; display: flex; flex-direction: column; min-height: 0; -webkit-app-region: no-drag; }
    .toolbar {
      flex: none; display: flex; gap: 8px; align-items: center;
      padding: 10px 18px; border-bottom: 1px solid var(--border-light);
    }
    .toolbar input[type="text"] {
      flex: 1; height: 32px; padding: 0 12px;
      border: 1px solid var(--border-medium); border-radius: 8px;
      background: var(--input-bg); color: var(--text-primary);
      outline: none; font-size: 13px;
    }
    .toolbar input[type="text"]:focus { border-color: var(--accent); }
    .toolbar input[type="text"]::placeholder { color: var(--text-tertiary); }
    .toolbar .hint { color: var(--text-tertiary); font-size: 11px; white-space: nowrap; }
    .diag {
      flex: none; margin: 0 18px 4px; padding: 6px 12px;
      border-radius: 8px; font-size: 11px; color: var(--accent);
      background: var(--accent-soft); border: 1px dashed rgba(103,158,254,0.25);
      font-family: Consolas, monospace; white-space: pre-wrap; word-break: break-all;
    }
    .diag.err { color: #f26a6a; background: rgba(242,106,106,0.08); border-color: rgba(242,106,106,0.3); }
    .diag.ok { color: var(--success); background: rgba(74,209,139,0.08); border-color: rgba(74,209,139,0.3); }
    .list {
      flex: 1; overflow-y: auto; padding: 12px 18px 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .pkg {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border: 1px solid var(--border-light); border-radius: 12px;
      background: var(--card-bg);
    }
    .pkg .info { flex: 1; min-width: 0; }
    .pkg .name { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .pkg .stars { color: #f5c34c; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .pkg .stars::before { content: '★ '; }
    .pkg .desc { color: var(--text-secondary); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .pkg .url { color: var(--text-tertiary); font-size: 10px; margin-top: 3px; font-family: Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pkg .status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
    .status.enabled { background: rgba(74,209,139,0.15); color: var(--success); }
    .status.disabled { background: rgba(139,147,167,0.15); color: var(--text-secondary); }
    .status.installed { background: var(--accent-soft); color: var(--accent); }
    .status.error { background: rgba(242,106,106,0.15); color: #f26a6a; }
    .actions { display: flex; gap: 6px; align-items: center; -webkit-app-region: no-drag; flex: none; }
    .actions select {
      height: 28px; padding: 0 6px; border: 1px solid var(--border-medium); border-radius: 8px;
      background: var(--bg-layer-2); color: var(--text-primary); font-size: 12px; outline: none; max-width: 160px;
    }
    button {
      -webkit-app-region: no-drag;
      height: 30px; padding: 0 12px; border: none; border-radius: 8px;
      background: var(--accent); color: #fff; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background 0.15s ease; white-space: nowrap;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border-light); }
    button.secondary:hover { background: rgba(255,255,255,0.08); }
    button.danger { background: var(--danger); }
    button.danger:hover { background: var(--danger-hover); }
    button.success { background: rgba(74,209,139,0.8); }
    button.success:hover { background: rgba(74,209,139,1); }
    .empty { color: var(--text-tertiary); text-align: center; padding: 40px 0; font-size: 12px; }
    .bottom { flex: none; padding: 0 18px 12px; display: flex; flex-direction: column; gap: 8px; }
    .banner {
      display: none; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 10px; font-size: 12px;
      background: rgba(255,210,77,0.08); border: 1px solid rgba(255,210,77,0.25); color: var(--warning);
    }
    .banner.show { display: flex; }
    .banner button { background: var(--warning); color: #3a2c00; height: 28px; font-size: 12px; margin-left: auto; }
    .log {
      background: var(--log-bg); border: 1px solid var(--border-light); border-radius: 10px;
      padding: 8px 12px; max-height: 100px; overflow-y: auto;
      font-family: Consolas, 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.6;
      color: var(--text-secondary); white-space: pre-wrap; word-break: break-all;
    }
    .log .ok { color: var(--success); }
    .log .err { color: #f26a6a; }
    .log .info { color: var(--accent); }

    /* ── Pagination ── */
    .pager {
      display: none; align-items: center; gap: 6px;
      margin-left: auto; white-space: nowrap;
    }
    .pager.show { display: flex; }
    .pager button {
      height: 28px; padding: 0 10px; font-size: 12px;
    }
    .pager .page-info {
      font-size: 12px; color: var(--text-secondary); min-width: 60px; text-align: center;
    }

    /* ── Detail modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.5); -webkit-app-region: no-drag;
    }
    .modal-overlay.open { display: flex; align-items: center; justify-content: center; }
    .modal {
      width: 86%; max-width: 680px; max-height: 85vh;
      display: flex; flex-direction: column;
      background: var(--bg-layer-1); border: 1px solid var(--border-medium);
      border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    .modal-header {
      flex: none; display: flex; align-items: flex-start; gap: 12px;
      padding: 20px 24px 12px; border-bottom: 1px solid var(--border-light);
    }
    .modal-header .mh-info { flex: 1; min-width: 0; }
    .modal-header .mh-name { font-size: 18px; font-weight: 700; }
    .modal-header .mh-fullname { font-size: 12px; color: var(--text-tertiary); font-family: Consolas, monospace; margin-top: 2px; }
    .modal-header .mh-meta { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--text-secondary); }
    .modal-header .mh-meta span { display: flex; align-items: center; gap: 3px; }
    .modal-header .mh-close {
      flex: none; width: 28px; height: 28px; border: none; border-radius: 8px;
      background: transparent; color: var(--text-secondary); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-header .mh-close:hover { background: var(--card-bg); color: var(--text-primary); }
    .modal-body {
      flex: 1; overflow-y: auto; padding: 16px 24px 20px;
    }
    .modal-body .md-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 14px; }
    .modal-body .md-topics { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .modal-body .md-topics span {
      padding: 2px 10px; border-radius: 12px; font-size: 11px;
      background: var(--accent-soft); color: var(--accent);
    }
    .modal-body .md-status { margin-bottom: 14px; }
    .modal-body .md-readme-label {
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    .modal-body .md-readme {
      font-size: 12px; line-height: 1.7; color: var(--text-secondary);
      white-space: pre-wrap; word-break: break-word;
      background: var(--card-bg); border: 1px solid var(--border-light);
      border-radius: 10px; padding: 14px; max-height: 320px; overflow-y: auto;
    }
    .modal-body .md-readme h1 { font-size: 15px; margin: 0 0 8px; color: var(--text-primary); }
    .modal-body .md-readme h2 { font-size: 14px; margin: 10px 0 6px; color: var(--text-primary); }
    .modal-body .md-readme h3 { font-size: 13px; margin: 8px 0 4px; color: var(--text-primary); }
    .modal-body .md-readme p { margin: 4px 0; }
    .modal-body .md-readme code { background: var(--log-bg); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
    .modal-body .md-readme pre { background: var(--log-bg); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 11px; margin: 6px 0; }
    .modal-body .md-readme ul, .modal-body .md-readme ol { margin: 4px 0; padding-left: 20px; }
    .modal-body .md-readme a { color: var(--accent); }
    .modal-body .md-readme img { max-width: 100%; border-radius: 6px; }
    .modal-footer {
      flex: none; display: flex; gap: 8px; justify-content: flex-end;
      padding: 12px 24px 18px; border-top: 1px solid var(--border-light);
    }
  </style>
</head>
<body>
  <header>
    <div><span class="title" data-i18n="app.title">🐋 插件管理</span><span class="tip" data-i18n="app.tip">浏览 · 订阅 · 启用 · 停用 · 卸载</span></div>
    <button class="lang-btn" id="langBtn" data-i18n="langBtnLabel">EN</button>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="community" data-i18n="tab.community">社区</button>
    <button class="tab" data-tab="installed" data-i18n="tab.installed">已安装</button>
  </nav>
  <main>
    <div class="toolbar" id="toolbar">
      <input id="search" type="text" data-i18n="search.placeholder|placeholder" placeholder="搜索插件…（按 ⭐ 热度降序）" spellcheck="false">
      <span class="hint" id="hint" data-i18n="hint.community"></span>
      <div class="pager" id="pager">
        <button id="pagePrev" class="secondary" disabled data-i18n="pager.prev">‹ 上一页</button>
        <span class="page-info" id="pageInfo">第 1 页</span>
        <button id="pageNext" class="secondary" data-i18n="pager.next">下一页 ›</button>
      </div>
    </div>
    <div class="diag" id="diag" data-i18n="diag.started">启动中…</div>
    <div class="list" id="list"><div class="empty" id="loading" data-i18n="loading">加载中…</div></div>
  </main>
  <div class="bottom">
    <div class="banner" id="restartBanner">
      <span data-i18n="banner.text">插件配置已更新，需要重启应用才能生效。</span>
      <button id="restartBtn" data-i18n="restart">立即重启</button>
    </div>
    <div class="log" id="log"></div>
  </div>

  <!-- ── Detail modal ── -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="mh-info">
          <div class="mh-name" id="mdName"></div>
          <div class="mh-fullname" id="mdFullName"></div>
          <div class="mh-meta">
            <span>⭐ <span id="mdStars"></span></span>
            <span id="mdTopics" class="md-topics" style="display:inline-flex;gap:4px;margin:0"></span>
          </div>
        </div>
        <button class="mh-close" id="mdClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="md-desc" id="mdDesc"></div>
        <div class="md-status" id="mdStatus"></div>
        <div class="md-readme-label" data-i18n="modal.readmeLabel">📖 README</div>
        <div class="md-readme" id="mdReadme" data-i18n="modal.readmeLoading">加载中…</div>
      </div>
      <div class="modal-footer">
        <button class="secondary" id="mdCloseBtn" data-i18n="modal.close">关闭</button>
        <button id="mdSubscribeBtn" data-i18n="modal.subscribe">订阅</button>
      </div>
    </div>
  </div>

  <script src="plugin-manager.js"></script>
</body>
</html>

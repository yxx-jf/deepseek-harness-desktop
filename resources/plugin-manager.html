<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <title>插件管理 · DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      -webkit-app-region: drag;
      display: flex; flex-direction: column;
      background: #0e1117;
      color: #e8edf7;
      font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      user-select: none; overflow: hidden;
    }
    header {
      flex: none; display: flex; align-items: baseline; justify-content: space-between;
      padding: 14px 18px 4px;
    }
    header .title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    header .tip { color: #8b93a7; font-size: 12px; margin-left: 10px; }
    /* ── tabs ── */
    .tabs {
      flex: none; display: flex; gap: 4px; padding: 8px 18px 0;
      -webkit-app-region: no-drag;
    }
    .tab {
      padding: 8px 16px; border: none; border-radius: 10px 10px 0 0;
      background: transparent; color: #8b93a7; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
    }
    .tab:hover { color: #c7cede; background: rgba(255,255,255,0.04); }
    .tab.active { color: #e8edf7; background: rgba(103,158,254,0.12); }
    main { flex: 1; display: flex; flex-direction: column; min-height: 0; -webkit-app-region: no-drag; }
    .toolbar {
      flex: none; display: flex; gap: 8px; align-items: center;
      padding: 10px 18px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .toolbar input[type="text"] {
      flex: 1; height: 32px; padding: 0 12px;
      border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
      background: rgba(255,255,255,0.04); color: #e8edf7;
      outline: none; font-size: 13px;
    }
    .toolbar input[type="text"]:focus { border-color: rgb(103,158,254); }
    .toolbar input[type="text"]::placeholder { color: #5f6c88; }
    .toolbar .hint { color: #5f6c88; font-size: 11px; white-space: nowrap; }
    .diag {
      flex: none; margin: 0 18px 4px; padding: 6px 12px;
      border-radius: 8px; font-size: 11px; color: #8fb0ff;
      background: rgba(103,158,254,0.08); border: 1px dashed rgba(103,158,254,0.25);
      font-family: Consolas, monospace; white-space: pre-wrap; word-break: break-all;
    }
    .diag.err { color: #f26a6a; background: rgba(242,106,106,0.08); border-color: rgba(242,106,106,0.3); }
    .diag.ok { color: #4ad18b; background: rgba(74,209,139,0.08); border-color: rgba(74,209,139,0.3); }
    .list {
      flex: 1; overflow-y: auto; padding: 12px 18px 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .pkg {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      background: rgba(255,255,255,0.03);
    }
    .pkg .info { flex: 1; min-width: 0; }
    .pkg .name { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .pkg .stars { color: #f5c34c; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .pkg .stars::before { content: '★ '; }
    .pkg .desc { color: #8b93a7; font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .pkg .url { color: #5f6c88; font-size: 10px; margin-top: 3px; font-family: Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pkg .status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
    .status.enabled { background: rgba(74,209,139,0.15); color: #4ad18b; }
    .status.disabled { background: rgba(139,147,167,0.15); color: #8b93a7; }
    .status.installed { background: rgba(103,158,254,0.15); color: #8fb0ff; }
    .status.error { background: rgba(242,106,106,0.15); color: #f26a6a; }
    .actions { display: flex; gap: 6px; align-items: center; -webkit-app-region: no-drag; flex: none; }
    .actions select {
      height: 28px; padding: 0 6px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
      background: #171b24; color: #e8edf7; font-size: 12px; outline: none; max-width: 160px;
    }
    button {
      -webkit-app-region: no-drag;
      height: 30px; padding: 0 12px; border: none; border-radius: 8px;
      background: rgb(65,118,230); color: #fff; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background 0.15s ease; white-space: nowrap;
    }
    button:hover { background: rgb(86,134,254); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: rgba(255,255,255,0.08); color: #c7cede; }
    button.secondary:hover { background: rgba(255,255,255,0.14); }
    button.danger { background: rgba(236,19,19,0.75); }
    button.danger:hover { background: rgba(236,19,19,0.9); }
    button.success { background: rgba(74,209,139,0.8); }
    button.success:hover { background: rgba(74,209,139,1); }
    .empty { color: #5f6c88; text-align: center; padding: 40px 0; font-size: 12px; }
    /* Logs + banner */
    .bottom { flex: none; padding: 0 18px 12px; display: flex; flex-direction: column; gap: 8px; }
    .banner {
      display: none; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 10px; font-size: 12px;
      background: rgba(255,210,77,0.08); border: 1px solid rgba(255,210,77,0.25); color: #ffd24d;
    }
    .banner.show { display: flex; }
    .banner button { background: #ffd24d; color: #3a2c00; height: 28px; font-size: 12px; margin-left: auto; }
    .log {
      background: #090b10; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px;
      padding: 8px 12px; max-height: 100px; overflow-y: auto;
      font-family: Consolas, 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.6;
      color: #9fb3d1; white-space: pre-wrap; word-break: break-all;
    }
    .log .ok { color: #4ad18b; }
    .log .err { color: #f26a6a; }
    .log .info { color: #8fb0ff; }
  </style>
</head>
<body>
  <header>
    <div><span class="title">🐋 插件管理</span><span class="tip">浏览 · 订阅 · 启用 · 停用 · 卸载</span></div>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="community">社区</button>
    <button class="tab" data-tab="theme">主题</button>
    <button class="tab" data-tab="installed">已安装</button>
  </nav>
  <main>
    <div class="toolbar" id="toolbar">
      <input id="search" type="text" placeholder="搜索插件…（按 ⭐ 热度降序）" spellcheck="false">
      <span class="hint" id="hint"></span>
    </div>
    <div class="diag" id="diag">启动中…</div>
    <div class="list" id="list"><div class="empty" id="loading">加载中…</div></div>
  </main>
  <div class="bottom">
    <div class="banner" id="restartBanner">
      <span>插件配置已更新，需要重启应用才能生效。</span>
      <button id="restartBtn">立即重启</button>
    </div>
    <div class="log" id="log"></div>
  </div>
  <script src="plugin-manager.js"></script>
</body>
</html>
